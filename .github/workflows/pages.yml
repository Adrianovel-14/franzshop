# La tienda ahora vive en https://franzshopp.com (Cloudflare Pages se publica solo al subir a main).
# GitHub Pages ya no publica la tienda: solo redirige los links viejos
#   adrianovel-14.github.io/franzshop/...  →  franzshopp.com
# para que nadie llegue a una página rota y Google no vea la tienda repetida.
name: Redirigir links viejos a franzshopp.com

on:
  push:
    branches: [main]
    paths: ['.github/redireccion.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Armar las páginas de redirección
        run: |
          mkdir -p _site/nuevo
          cp .github/redireccion.html _site/index.html
          cp .github/redireccion.html _site/404.html
          cp .github/redireccion.html _site/nuevo/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
